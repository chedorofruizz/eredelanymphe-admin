<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ère de la Nymphe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Full-page clickable area */
    a.heroLink {
      display: block;
      position: relative;
      height: 100%;
      text-decoration: none;
      color: white;
    }

    /* Centered fairy image, no effects */
    .hero {
      position: absolute;
      inset: 0;
      background: url("landing2.png") center center / contain no-repeat;
    }

    /* Simple French hint */
    .hint {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #d6b36a;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <a class="heroLink" href="/liens.html">
    <div class="hero"></div>
    <div class="hint">Découvre</div>
  </a>
</body>
</html>
