<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liens – Ère de la Nymphe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .brand a {
      display: block;
      text-decoration: none;
    }

    .brand img {
      width: 100%;
      max-width: 600px;
      height: auto;
      margin-bottom: 45px;
      display: block;
      cursor: pointer;
    }

    .shop-link {
      display: inline-block;
      margin-bottom: 45px;
      padding: 14px 34px;
      background: #d6b36a;
      color: #000;
      font-family: "PT Serif", serif;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .shop-link:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }

    .logos {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .logos {
        flex-direction: row;
        gap: 50px;
      }
    }

    .logos a {
      display: inline-block;
    }

    .logos img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: transparent;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: block;
    }

    .logos a:hover img {
      transform: scale(1.08);
      opacity: 0.85;
    }

    .back {
      margin-top: 50px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d6b36a;
      text-decoration: none;
      opacity: 0.8;
    }

    .back:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <div class="brand">
      <a href="/" aria-label="Retour à l'accueil">
        <img src="/assets/brand/logo.png?v=2" alt="Ère de la Nymphe">
      </a>
    </div>

    <a class="shop-link" href="https://eredelanymphe.myshopify.com/" target="_blank" rel="noopener">
      Boutique
    </a>

    <div class="logos">
      <a href="https://www.youtube.com/@eredelanymphe" target="_blank" rel="noopener">
        <img src="/assets/logos/youtube.png?v=2" alt="YouTube">
      </a>

      <a href="https://www.facebook.com/profile.php?id=61574511766758" target="_blank" rel="noopener">
        <img src="/assets/logos/facebook.png?v=2" alt="Facebook">
      </a>

      <a href="https://instagram.com/eredelanymphe" target="_blank" rel="noopener">
        <img src="/assets/logos/instagram2.png?v=2" alt="Instagram">
      </a>

      <a href="https://www.tiktok.com/@eredelanymphe" target="_blank" rel="noopener">
        <img src="/assets/logos/tiktok.png?v=2" alt="TikTok">
      </a>
    </div>

    <a class="back" href="/">Retour</a>

  </div>
</body>
</html>
