    }

      .logos {
        flex-direction: row;
        gap: 50px;
      }
    }

    .logos a {
      display: inline-block;
    }

    .logos img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: transparent;
      transition: transform 0.2s ease, opacity 0.2s ease;

    .logos a:hover img {

      letter-spacing: 0.2em;
      text-transform: uppercase;
